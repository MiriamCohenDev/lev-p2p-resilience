name: lev
description: "LEV — an offline-first, privacy-preserving app for supportive chat with a local language model and local mutual aid."
# Never published to pub.dev; LEV is distributed as installable artifacts (see technical-decisions #2).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + dependency injection (technical-decisions #7).
  flutter_riverpod: ^3.4.2
  # Routing (technical-decisions #9).
  go_router: ^17.5.0
  # UUID primary keys for every shareable entity (technical-spec Section 6).
  uuid: ^4.6.0
  # Localization support: English + Hebrew UI, incl. RTL (technical-decisions #11).
  intl: ^0.20.3
  # Grapheme-safe string handling. Direct, not transitive: truncating a title by
  # code unit splits surrogate pairs and Hebrew combining marks.
  characters: ^1.4.1
  cryptography_plus: ^3.0.0
  flutter_secure_storage: ^11.0.0

  # Local llama.cpp inference (technical-spec Section 5.2, technical-decisions
  # #19). Native binaries arrive through Dart build hooks, exactly as SQLCipher
  # does below — no C++ toolchain, no per-platform plugin wiring.
  llamadart: ^0.8.20
  # Streaming SHA-256 for the model integrity check (technical-spec Section 7.5).
  # Direct, not transitive: `cryptography_plus` (used for key wrapping) buffers
  # the whole input before hashing, which would cost as much RAM as the model.
  crypto: ^3.0.7
  # Reading device RAM through FFI, for the min-spec gate (Section 8).
  ffi: ^2.2.0

  # Opens the dialler for the support card's `tel:` action (technical-decisions
  # #25). The only thing it is used for: a link to a website would be a dead
  # button in an app with no network, so a phone call is the single action the
  # safety layer offers.
  url_launcher: ^6.3.2

  # Renders the LEV mark from its own SVG (technical-decisions #27), so the
  # design's file stays the single source of truth for the logo instead of a
  # path transcribed into Dart. Pure Dart, no network, no native code.
  flutter_svg: ^2.2.1

  # Encrypted local database (technical-spec Section 5.5, technical-decisions #4).
  drift: ^2.34.3
  # Direct: the storage layer runs SQLCipher pragmas against it (see `hooks`).
  sqlite3: ^3.5.2
  # Locating the database file per platform.
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests: the real secure store and the real database file, which a
  # host test cannot reach (see integration_test/).
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Mocking domain interfaces in unit tests (technical-spec Section 4).
  mocktail: ^1.0.4
  # Drift table code generation.
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

# Builds SQLite as SQLCipher instead of plain SQLite (technical-decisions #13).
# `sqlcipher_flutter_libs` — named in technical-spec Section 4 — is EOL; from
# package:sqlite3 3.x the native library is selected here. Without this block
# the app links plain SQLite, where `PRAGMA key` is silently ignored — see the
# cipher_version guard in lib/core/db/encrypted_database_opener.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
    # llama.cpp only. llamadart also ships a LiteRT-LM runtime and a WebGPU
    # (Dawn) stack, which together add roughly 90 MB of native libraries per
    # desktop build for code LEV never calls — technical-spec Section 3 names
    # llama.cpp as the engine, and Section 8 makes install size a budget rather
    # than an afterthought. See technical-decisions #19.
    llamadart:
      llamadart_native_runtimes: llama_cpp

flutter:
  uses-material-design: true
  # Generates localizations from lib/core/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # The models manifest (technical-spec §5.3). The GGUF file itself lands here
    # in Phase 3.
    - assets/models/
    # The versioned system prompt and the safety pattern lists (§5.2.1, §5.2.4).
    # Assets rather than string literals so both can be tuned without a rebuild.
    - assets/prompts/
    # The support message, its phone number and its review date, per UI language
    # (technical-decisions #24). An asset for the same reason the patterns are
    # one: a number that has gone stale is worse than a message that never
    # appeared, and it must be fixable without a rebuild.
    - assets/support/
    # The LEV mark, in the two geometries the logo pack ships: a regular one and
    # a heavier `micro` for small sizes. Copied verbatim from the design's
    # `lev-logo/svg/`, and the only source of truth for the logo in the app
    # (technical-decisions #27).
    - assets/branding/

  # Bundled, never downloaded: `google_fonts` fetches from the network on first
  # run, which §8 makes a defect rather than a trade-off (technical-decisions
  # #26). IBM Plex Sans Hebrew is OFL-licensed, so shipping it is permitted —
  # assets/fonts/OFL.txt is the licence as published.
  fonts:
    - family: IBMPlexSansHebrew
      fonts:
        - asset: assets/fonts/IBMPlexSansHebrew-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansHebrew-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansHebrew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansHebrew-Bold.ttf
          weight: 700
